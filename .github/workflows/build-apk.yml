name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform (if not already present)
        run: npx cap add android || npx cap sync android

      - name: Generate app icon & splash screen from resources/
        run: npx @capacitor/assets generate --android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Insert AdMob App ID into AndroidManifest.xml
        run: |
          python3 - <<'EOF'
          import pathlib, re

          app_id_file = pathlib.Path("admob-app-id.txt")
          app_id = None
          for line in app_id_file.read_text().splitlines():
              line = line.strip()
              if line and not line.startswith("#"):
                  app_id = line
                  break
          if not app_id:
              raise SystemExit("No AdMob App ID found in admob-app-id.txt")

          manifest_path = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          content = manifest_path.read_text()

          meta_data = (
              '\n    <meta-data\n'
              '        android:name="com.google.android.gms.ads.APPLICATION_ID"\n'
              f'        android:value="{app_id}" />\n'
          )

          if "com.google.android.gms.ads.APPLICATION_ID" in content:
              content = re.sub(
                  r'android:name="com\.google\.android\.gms\.ads\.APPLICATION_ID"\s+android:value="[^"]*"',
                  f'android:name="com.google.android.gms.ads.APPLICATION_ID"\n        android:value="{app_id}"',
                  content,
              )
          else:
              content = re.sub(
                  r'(<application[^>]*>)',
                  r'\1' + meta_data,
                  content,
                  count=1,
              )

          manifest_path.write_text(content)
          print(f"AndroidManifest.xml patched with AdMob App ID: {app_id}")
          EOF

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Generate temporary release keystore
        # Creates a real (non-debug) self-signed keystore on the fly, right
        # here in the workflow. This satisfies Amazon's "must not be signed
        # with the Android Debug Certificate" rule with zero setup.
        #
        # IMPORTANT LIMITATION: this keystore is NOT saved anywhere, so a new
        # one is generated on every run. That means each APK you download
        # will have a DIFFERENT signature. Amazon/Google will treat every
        # upload as a brand new, unrelated app - you will NOT be able to
        # publish updates to the same app listing this way. This unblocks a
        # first submission, but for real ongoing updates you eventually need
        # one keystore that stays the same across builds.
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias warranty-tracker \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass temporary123 -keypass temporary123 \
            -dname "CN=Warranty Tracker, OU=App, O=Nazir Hussain, L=City, S=State, C=PK"

      - name: Configure release signing with temporary keystore
        run: |
          python3 - <<'EOF'
          import pathlib

          p = pathlib.Path("android/app/build.gradle")
          content = p.read_text()

          # 1. Add the signingConfigs block (holds the keystore credentials)
          #    right after "android {", only if not already present.
          signing_config = '''
          signingConfigs {
              release {
                  storeFile file("release.keystore")
                  storePassword "temporary123"
                  keyAlias "warranty-tracker"
                  keyPassword "temporary123"
              }
          }
          '''

          if "signingConfigs {" not in content:
              content = content.replace(
                  "android {",
                  "android {\n    " + signing_config.strip(),
                  1,
              )

          # 2. Point buildTypes.release at that signingConfig. We must only
          #    touch the "release {" inside buildTypes, NOT the "release {"
          #    inside the signingConfigs block we just added above - so we
          #    search for "release {" starting AFTER "buildTypes {".
          marker = "signingConfig signingConfigs.release"
          if marker not in content:
              bt_index = content.index("buildTypes {")
              rel_index = content.index("release {", bt_index)
              insert_at = rel_index + len("release {")
              content = (
                  content[:insert_at]
                  + "\n            " + marker
                  + content[insert_at:]
              )

          p.write_text(content)
          print("Patched build.gradle with temporary release signingConfig")
          EOF

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Remove keystore from workspace
        if: always()
        run: rm -f android/app/release.keystore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: warranty-tracker-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
